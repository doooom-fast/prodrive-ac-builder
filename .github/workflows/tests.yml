name: tests

# First machine check in this repo's history (added 2026-08-10, v2 reboot).
# The suite is hermetic and stdlib-only — no Blender, no AC, no network — and runs in seconds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test suite
        run: python tests/run_tests.py
