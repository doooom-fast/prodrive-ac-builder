; ============================================================================
; sand_creek_raceway — CSP ext_config (generated by scripts/ac/ext_config.py)
; Custom Shaders Patch reads this automatically. Names match the kn5 (pbr.py -> <obj>_mat).
; VERIFY IN-GAME — CSP config keys evolve between versions.
; Ref: github.com/ac-custom-shaders-patch/acc-extension-config/wiki
; ============================================================================

; --- GrassFX: 3D grass on the terrain ---------------------------------------
[GRASS_FX]
GRASS_MESHES = 1GRASS
OCCLUDING_MESHES = 1ROAD_shoulder, 1RUNOFF_corners, 1ROAD_main, 1KERB_corners, MARKINGS, MARKINGS_crosswalk, ROADTEXT, 1ROAD_interior_grid_0, 1ROAD_interior_grid_1, 1ROAD_interior_grid_2, WATER, BUILDINGS, WAREHOUSE, ROOFS
MASK_MAIN_THRESHOLD = 0.5
MASK_RED_THRESHOLD = 0.05
MASK_MIN_LUMINANCE = 0.02
MASK_MAX_LUMINANCE = 0.35

; --- RainFX: wet surfaces, puddles, reflections, spray ----------------------
; No master enable key — listing materials IS the enable. PUDDLES/SOAKING are road-only
; per CSP docs (kerbs excluded on purpose). WATER keeps its own shader (not listed here).
; Ref: acc-extension-config wiki -> Tracks - RainFX
[RAIN_FX]
PUDDLES_MATERIALS = 1ROAD_shoulder_mat, 1RUNOFF_corners_mat, 1ROAD_main_mat, 1ROAD_interior_grid_0_mat, 1ROAD_interior_grid_1_mat, 1ROAD_interior_grid_2_mat
SOAKING_MATERIALS = 1ROAD_shoulder_mat, 1RUNOFF_corners_mat, 1ROAD_main_mat, 1ROAD_interior_grid_0_mat, 1ROAD_interior_grid_1_mat, 1ROAD_interior_grid_2_mat
LINES_MATERIALS = MARKINGS_mat, MARKINGS_crosswalk_mat
ROUGH_MATERIALS = 1GRASS_mat

; --- Light pollution: warm sodium sky/horizon glow over the loop at night ---
; COLOR is r,g,b (0..1) ONLY — no 4th term. CSP auto-gates it to night.
[LIGHT_POLLUTION]
ACTIVE = 1
COLOR = 1.0, 0.62, 0.28      ; high-pressure-sodium amber (industrial corridor)
DENSITY = 0.28
RADIUS_KM = 1.2
RELATIVE_POSITION = -2.0, 0, -3.0  ; bias toward Denver (SW); keeps the W Front Range darker

; --- Global night lighting: lift emissive response a hair -------------------
[LIGHTING]
LIT_MULT = 1.05
BOUNCED_LIGHT_MULT = 1, 1, 1, 0.12

; --- Water: real water shader on Sand Creek ---------------------------------
[INCLUDE: common/materials_track.ini]

[Material_Water]
Materials = WATER_mat
Type = POND

; --- Streetlights: one light per post + glowing lamp at night ---------------
[LIGHT_SERIES_STREETLIGHTS]
MESHES = LIGHTS
OFFSET = 0, 3.5, 0          ; lift the light toward the top of the ~9 m post
COLOR = 1.0, 0.82, 0.55, 30 ; warm sodium-ish, last value = intensity
COLOR_OFF = 0, 0, 0, 0      ; fully off by day
CONDITION = NIGHT_SMOOTH    ; ramp on at dusk (CSP pre-shipped condition)
RANGE = 38
SPOT = 124
SPOT_SHARPNESS = 0.3
DIRECTION = 0, -1, 0        ; shine downward
CLUSTER_THRESHOLD = 8       ; posts are ~48 m apart -> one light each

[MATERIAL_ADJUSTMENT_STREETLIGHTS]
MATERIALS = LIGHTS_mat
KEY_0 = ksEmissive
VALUE_0 = 255, 209, 166, 0.5  ; ksEmissive is 0-255 RGB + brightness (NOT 0..1!)
VALUE_0_OFF = 0, 0, 0, 0
CONDITION = NIGHT_SMOOTH

; --- Lit windows at night --------------------------------------------------
[MATERIAL_ADJUSTMENT_LIT_WINDOWS]
MATERIALS = BUILDING_mat
KEY_0 = ksEmissive
VALUE_0 = 255, 200, 112, 0.5
VALUE_0_OFF = 0, 0, 0, 0
CONDITION = NIGHT_SMOOTH

