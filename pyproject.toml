[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "prodrive-ac-builder"
version = "0.1.0"
description = "Convert real-world road loops into playable Assetto Corsa tracks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core pipeline deps. NOTE: `bpy` (Blender's Python API) is NOT installed here — it is
# provided by the Blender 4.x runtime when scripts run via `blender --background --python`.
# The AC Blender Tools (kn5 export) addon is also installed inside Blender, not via pip.
dependencies = [
  "requests>=2.34",   # Overpass / USGS HTTP
  "pyproj>=3.7",      # lat/lon -> local-meter projection
  "shapely>=2.1",     # centerline / ribbon geometry ops
  "numpy>=2.5",       # arrays, heightfields
  "scipy>=1.18",      # resampling & smoothing splines
  "rasterio>=1.5",    # DEM (GeoTIFF) I/O  — needs system GDAL
  "trimesh>=5.0",     # mesh validation
  "astral>=3.2",      # solar azimuth/elevation for lighting
]

[project.scripts]
# Optional phase-6 step: install a built track into a local Assetto Corsa content/tracks folder.
prodrive-ac-install = "scripts.ac.install:main"

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
